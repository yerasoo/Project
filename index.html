<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6b5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할 일">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>오늘의 할 일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow notebook column — header with date & progress, input row, filter tabs, task list */
:root {
  --bg: #eef2f0;
  --paper: #fbfcfb;
  --ink: #1c2725;
  --muted: #62716d;
  --line: #d6dfdb;
  --accent: #2b6b5f;
  --accent-soft: #dcebe6;
  --warn: #b5562b;
  --warn-soft: #f6e3d8;
  --font-display: "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121817; --paper: #1a2220; --ink: #e4ebe8; --muted: #93a39e; --line: #2c3835;
    --accent: #6fbfab; --accent-soft: #23362f; --warn: #e8936a; --warn-soft: #3a2a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121817; --paper: #1a2220; --ink: #e4ebe8; --muted: #93a39e; --line: #2c3835;
  --accent: #6fbfab; --accent-soft: #23362f; --warn: #e8936a; --warn-soft: #3a2a22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(40px + env(safe-area-inset-top, 0px)) calc(64px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }
.date { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }
h1 { font-family: var(--font-display); font-size: 34px; line-height: 1.2; margin: 0; text-wrap: balance; }
.progress { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

form.add { display: flex; flex-wrap: wrap; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
form.add input[type="text"] { flex: 1 1 220px; min-width: 0; }
input, select, button { font: inherit; color: inherit; }
input[type="text"], input[type="date"], select {
  border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 0; border-radius: 7px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.btn-primary { background: var(--accent); color: var(--paper); }
.btn-primary:hover { filter: brightness(1.08); }

.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.tabs { display: flex; gap: 4px; }
.tab { background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 14px; }
.tab[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.link { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }

ul.list { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
li.task { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
li.task:first-child { border-top: 0; }
.check { appearance: none; width: 20px; height: 20px; margin: 2px 0 0; border: 2px solid var(--muted); border-radius: 50%; cursor: pointer; flex: none; display: grid; place-items: center; }
.check:checked { background: var(--accent); border-color: var(--accent); }
.check:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.text { overflow-wrap: anywhere; cursor: text; }
.task.done .text { color: var(--muted); text-decoration: line-through; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.chip { padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.high { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.due-soon { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.overdue { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.sample { border: 1px dashed var(--line); background: none; }
.del { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.del:hover { color: var(--warn); background: var(--warn-soft); }
.edit { width: 100%; border: 1px solid var(--accent); background: var(--bg); border-radius: 6px; padding: 4px 8px; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 14px 10px 16px; border-radius: 10px; display: flex; gap: 14px; align-items: center; font-size: 14px; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 600; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="date" id="today"></div>
    <h1>오늘의 할 일</h1>
    <div class="progress"><div class="bar"><span id="bar"></span></div><span id="count"></span></div>
  </header>

  <form class="add" id="add-form" autocomplete="off">
    <input type="text" id="new-text" placeholder="할 일을 입력하세요" aria-label="할 일" required>
    <input type="date" id="new-due" aria-label="마감일">
    <select id="new-priority" aria-label="중요도">
      <option value="normal">보통</option>
      <option value="high">중요</option>
    </select>
    <button class="btn btn-primary" type="submit">추가</button>
  </form>

  <div class="toolbar">
    <div class="tabs" role="group" aria-label="보기">
      <button class="tab" id="tab-all" data-filter="all" aria-pressed="true">전체</button>
      <button class="tab" id="tab-active" data-filter="active" aria-pressed="false">진행 중</button>
      <button class="tab" id="tab-done" data-filter="done" aria-pressed="false">완료</button>
    </div>
    <button class="link" id="clear-done" type="button">완료한 항목 지우기</button>
  </div>

  <ul class="list" id="list"></ul>
  <p class="hint">할 일을 더블클릭하면 수정할 수 있어요. 목록은 이 브라우저에 저장됩니다.</p>
</div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo" type="button">되돌리기</button></div>

<script>
(function () {
  var KEY = "todo-app-v1";
  var DAY = 86400000;

  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var samples = [
    { text: "장보기: 우유, 달걀, 사과", due: addDays(0), priority: "normal" },
    { text: "보고서 초안 제출", due: addDays(2), priority: "high" },
    { text: "운동 30분", due: "", priority: "normal" },
    { text: "도서관 책 반납", due: addDays(-1), priority: "normal" }
  ].map(function (t) { return Object.assign({ id: uid(), done: false, sample: true }, t); });

  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return samples;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} }

  var tasks = load();
  var filter = "all";
  var lastDeleted = null, toastTimer = null;

  var $ = function (id) { return document.getElementById(id); };
  var list = $("list");

  $("today").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

  function dueInfo(due) {
    if (!due) return null;
    var p = due.split("-").map(Number);
    var target = new Date(p[0], p[1] - 1, p[2]);
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var diff = Math.round((target - now) / DAY);
    if (diff < 0) return { label: -diff + "일 지남", cls: "overdue" };
    if (diff === 0) return { label: "오늘", cls: "due-soon" };
    if (diff === 1) return { label: "내일", cls: "due-soon" };
    return { label: "D-" + diff, cls: "" };
  }

  function chip(text, cls) { var s = document.createElement("span"); s.className = "chip " + (cls || ""); s.textContent = text; return s; }

  function render() {
    var shown = tasks.filter(function (t) { return filter === "all" || (filter === "done" ? t.done : !t.done); });
    list.innerHTML = "";
    if (!shown.length) {
      var e = document.createElement("li"); e.className = "empty";
      e.textContent = filter === "done" ? "아직 완료한 일이 없어요." : filter === "active" ? "남은 일이 없어요. 수고했어요!" : "첫 할 일을 위에 입력해 보세요.";
      list.appendChild(e);
    }
    shown.forEach(function (t) {
      var li = document.createElement("li"); li.className = "task" + (t.done ? " done" : ""); li.dataset.id = t.id;
      var cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "check"; cb.checked = t.done; cb.id = "chk-" + t.id;
      cb.setAttribute("aria-label", t.text + " 완료");
      var body = document.createElement("div"); body.className = "body";
      var text = document.createElement("div"); text.className = "text"; text.textContent = t.text;
      var meta = document.createElement("div"); meta.className = "meta";
      if (t.priority === "high") meta.appendChild(chip("중요", "high"));
      var d = dueInfo(t.due);
      if (d) meta.appendChild(chip(d.label, t.done ? "" : d.cls));
      if (t.sample) meta.appendChild(chip("예시", "sample"));
      body.appendChild(text); if (meta.children.length) body.appendChild(meta);
      var del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "×"; del.setAttribute("aria-label", t.text + " 삭제");
      li.append(cb, body, del);
      list.appendChild(li);
    });
    var done = tasks.filter(function (t) { return t.done; }).length;
    $("count").textContent = done + " / " + tasks.length + " 완료";
    $("bar").style.width = tasks.length ? (done / tasks.length * 100) + "%" : "0";
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.filter === filter)); });
    $("clear-done").hidden = done === 0;
  }

  function find(id) { return tasks.find(function (t) { return t.id === id; }); }

  function showToast(msg) {
    $("toast-msg").textContent = msg; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $("toast").hidden = true; lastDeleted = null; }, 5000);
  }

  $("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = $("new-text").value.trim(); if (!text) return;
    tasks.unshift({ id: uid(), text: text, due: $("new-due").value, priority: $("new-priority").value, done: false });
    $("new-text").value = ""; $("new-due").value = ""; $("new-priority").value = "normal";
    if (filter === "done") filter = "all";
    save(); render(); $("new-text").focus();
  });

  list.addEventListener("change", function (e) {
    if (!e.target.classList.contains("check")) return;
    var t = find(e.target.closest("li").dataset.id); t.done = e.target.checked; save(); render();
  });

  list.addEventListener("click", function (e) {
    if (!e.target.classList.contains("del")) return;
    var id = e.target.closest("li").dataset.id;
    var idx = tasks.findIndex(function (t) { return t.id === id; });
    lastDeleted = { items: [{ task: tasks[idx], idx: idx }] };
    tasks.splice(idx, 1); save(); render(); showToast("할 일을 삭제했어요.");
  });

  list.addEventListener("dblclick", function (e) {
    var textEl = e.target.closest(".text"); if (!textEl) return;
    var t = find(textEl.closest("li").dataset.id);
    var input = document.createElement("input"); input.type = "text"; input.className = "edit"; input.value = t.text; input.id = "edit-" + t.id;
    textEl.replaceWith(input); input.focus(); input.select();
    var finished = false;
    function finish(commit) {
      if (finished) return; finished = true;
      var v = input.value.trim(); if (commit && v) { t.text = v; delete t.sample; save(); }
      render();
    }
    input.addEventListener("keydown", function (k) { if (k.key === "Enter") finish(true); if (k.key === "Escape") finish(false); });
    input.addEventListener("blur", function () { finish(true); });
  });

  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return; filter = b.dataset.filter; render();
  });

  $("clear-done").addEventListener("click", function () {
    var removed = [];
    tasks.forEach(function (t, i) { if (t.done) removed.push({ task: t, idx: i }); });
    tasks = tasks.filter(function (t) { return !t.done; });
    lastDeleted = { items: removed }; save(); render(); showToast("완료한 " + removed.length + "개를 지웠어요.");
  });

  $("toast-undo").addEventListener("click", function () {
    if (!lastDeleted) return;
    lastDeleted.items.forEach(function (r) { tasks.splice(r.idx, 0, r.task); });
    lastDeleted = null; $("toast").hidden = true; save(); render();
  });

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
